<!DOCTYPE html>
<html>
<head>
    <title>Display Students</title>
</head>

<body>
    <h1>Student Information</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>

    <script>
        function updateStudent(id) {
    const newName = prompt("Enter new student name:");
    const newAge = prompt("Enter new student age:");

    fetch("/students/" + id, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: newName,
            age: newAge
        })
    })
    .then(response => response.text())
    .then(message => {
        console.log(message);
        location.reload();
    });
}
function deleteStudent(id) {
    const confirmDelete = confirm("Are you sure you want to delete this student?");

    if (confirmDelete) {
        fetch("/students/" + id, {
            method: "DELETE"
        })
        .then(response => response.text())
        .then(message => {
            console.log(message);
            location.reload();
        });
    }
}
        fetch("/students")
            .then(response => response.json())
            .then(students => {

                const studentTable =
                    document.getElementById("studentTable");

                students.forEach(student => {

                    const row = document.createElement("tr");

                    row.innerHTML =
                        "<td>" + student.id + "</td>" +
                        "<td>" + student.name + "</td>" +
                        "<td>" + student.age + "</td>" +
                        "<td>" +
"<button onclick=\"updateStudent(" + student.id + ")\">Update</button> " +
"<button onclick=\"deleteStudent(" + student.id + ")\">Delete</button>" +
"</td>";

                    studentTable.appendChild(row);
                });
            });
    </script>
    
    

</body>
</html>
